name: Python Bot CI Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # [تم التعديل]: تشغيل التثبيت باستخدام python -m لتفادي خطأ السيرفر وتجنب استخدام sudo
    - name: Install Playwright Browsers and Deps
      run: |
        python -m playwright install chromium
        sudo python -m playwright install-deps

    - name: Lint and Syntax Check
      run: |
        python -m compileall bot.py
