name: Amr Diab

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Media File
        run: |
          curl -L -o "media_file" 'https://archive.org/download/telegram-stream-cloud-06-----------------mp3/06%20-%20%D8%B9%D9%84%D9%85%20%D9%82%D9%84%D8%A8%D9%8A%20%D8%BA%D8%B1%D8%A7%D9%85.mp3'

      - name: Start Stream
        run: |
          ffmpeg -re -stream_loop -1 -i "media_file" \
            -vn \
            -af "volume=2" \
            -c:a aac \
            -b:a 128k \
            -ar 48000 \
            -ac 2 \
            -f flv \
            -flvflags no_duration_filesize \
            "rtmps://dc4-1.rtmp.t.me/s/3858287888:aMIwoGfAA7q_0IwVJqw0fA"

      - name: Done
        run: |
          echo "Finished."
