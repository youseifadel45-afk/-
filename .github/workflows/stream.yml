name: Continuous Live Stream

on:
  schedule:
    # إعادة تشغيل البث تلقائياً كل 6 ساعات لضمان عدم التوقف
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  live_stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Live Stream
        run: |
          # استبدل الرابط وسيرفر الـ RTMP بالبيانات الخاصة بك أو المتولدة من البوت
          ffmpeg -re -stream_loop -1 -i "${{ secrets.STREAM_MEDIA_URL }}" \
          -c:v libx264 -preset veryfast -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -pix_fmt yuv420p -g 50 -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -f flv "${{ secrets.RTMP_SERVER_URL }}/${{ secrets.STREAM_KEY }}"
