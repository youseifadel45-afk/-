name: Personal Live Stream (24/7 Auto-Restart)

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      media_url:
        description: 'Direct link to media file'
        required: true
      rtmp_url:
        description: 'Full RTMP Server URL with key'
        required: true
      volume:
        description: 'Audio Volume Level'
        required: false
        default: '1.5'
      bitrate:
        description: 'Audio Bitrate'
        required: false
        default: '128k'

jobs:
  live_stream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Continuous Live Stream
        run: |
          # تحديد قيم المدخلات إما من البوت مباشرة أو من Secrets المستودع
          MEDIA_URL="${{ github.event.inputs.media_url || secrets.STREAM_MEDIA_URL }}"
          RTMP_URL="${{ github.event.inputs.rtmp_url || secrets.RTMP_SERVER_URL }}"
          VOL="${{ github.event.inputs.volume || '1.5' }}"
          BITRATE="${{ github.event.inputs.bitrate || '128k' }}"

          echo "🚀 بدء البث المباشر..."
          
          while true; do
            echo "[$(date)] بدء تشغيل سيرفر البث عبر FFmpeg..."
            
            ffmpeg -re -stream_loop -1 \
              -i "$MEDIA_URL" \
              -vn -af "volume=$VOL" -c:a aac -b:a $BITRATE -ar 44100 -ac 2 \
              -f flv "$RTMP_URL"
              
            echo "[$(date)] ⚠️ انقطع الاتصال! جاري إعادة التشغيل خلال 5 ثوانٍ..."
            sleep 5
          done
