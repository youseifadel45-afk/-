name: Learn GitHub Actions

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Record 30 seconds
        run: |
          ffmpeg -re -i "https://stream.manhajonline.com/quran/stream" -t 30 -c:a aac -b:a 192k test.m4a

      - name: Show output file
        run: |
          ls -lh test.m4a

      - name: Upload audio
        uses: actions/upload-artifact@v4
        with:
          name: recorded-audio
          path: test.m4a

      - name: Done
        run: |
          echo "FFmpeg is working successfully."
